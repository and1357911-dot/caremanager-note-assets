name: Article Images QC - Read Only
on:
  workflow_dispatch:
    inputs:
      article_id:
        description: Article ID (OSN-NNN-YYYYMMDD)
        required: true
        type: string
  push:
    paths:
      - 'OSN-*/*.png'
      - 'scripts/check_article_images.py'
      - '.github/workflows/article-images-qc.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile image validator
        run: python3 -m py_compile scripts/check_article_images.py
      - name: Run six-file PNG integrity check for OSN-022
        run: python3 scripts/check_article_images.py OSN-022-20261101 | tee osn-022-image-qc.json
      - name: Upload downloadable PNG integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osn-022-png-integrity-report
          path: osn-022-image-qc.json
          if-no-files-found: warn
      - name: Check specified article on manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
        run: python3 scripts/check_article_images.py "$ARTICLE_ID"
      - name: Check all existing article folders on push
        if: github.event_name == 'push'
        run: |
          for dir in OSN-*; do
            [ -d "$dir" ] || continue
            python3 scripts/check_article_images.py "$dir"
          done
