name: Render OSN-022 Article Images (Assets Only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'specs/OSN-022-20261101.json'
permissions:
  contents: write
concurrency:
  group: osn-022-image-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font and image renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install --user Pillow==11.3.0
      - name: Stop if any target already exists
        run: |
          if [ -d OSN-022-20261101 ]; then
            echo "BLOCKED: article assets already exist; never overwrite"
            exit 1
          fi
      - name: Render six PNG files from public-safe copy
        run: python3 scripts/render_article_images.py OSN-022-20261101
      - name: Validate six PNGs
        run: python3 scripts/check_article_images.py OSN-022-20261101
      - name: Commit only six article images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OSN-022-20261101/instagram_*.png
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m "Generate six OSN-022 image assets (not published)"
          git push origin HEAD:main
